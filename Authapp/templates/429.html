
<!DOCTYPE html>
<html>
<head>
    <title>Rate Limit Exceeded</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }
        h1 {
            color: #e74c3c; /* Red for emphasis */
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2em;
            margin: 10px 0;
        }
        #countdown {
            font-size: 1.5em;
            font-weight: bold;
            color: #3498db; /* Blue for timer */
            margin-top: 20px;
        }
        .coffee-icon {
            font-size: 3em;
            margin-top: 20px;
            color: #7d5a29; /* Coffee brown */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Oops! Too Many Requests</h1>
        <p>{{ message }}</p>
        <p>We'll be ready for you soon. In the meantime, grab a coffee!</p>
        <p id="countdown"></p>
        <div class="coffee-icon">☕</div>  <!-- Simple emoji icon for fun -->
    </div>

</html>
